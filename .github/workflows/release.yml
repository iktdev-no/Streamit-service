name: Release builds

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-service:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Gradle cache
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            gradle-cache-

      - name: Restore build cache
        id: cache
        uses: actions/cache@v3
        with:
          path: ./build
          key: build-${{ hashFiles('./**/*') }}
          restore-keys: |
            build-

      - name: Build Spring Boot and TypeScript definitions
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar generateTs
          echo "Build completed"          

      - name: Export OpenAPI specification
        env:
          DATABASE_TYPE: H2
          DATABASE_NAME: openapi
          DATABASE_USERNAME: sa
          DATABASE_PASSWORD: ""
          CONFIG_FOLDER: /tmp/streamit-config
          AVAHI_SERVICE_FOLDER: /tmp/streamit-avahi-disabled
          ASSETS_FOLDER: /tmp/streamit-assets
        run: |
          mkdir -p ./build/release-assets
          java -jar ./build/libs/app.jar --spring.flyway.enabled=false --server.address=127.0.0.1 > /tmp/streamit-openapi.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/v3/api-docs.yaml \
              --output ./build/release-assets/openapi.yaml; then
              break
            fi
            sleep 2
          done

          test -s ./build/release-assets/openapi.yaml || {
            cat /tmp/streamit-openapi.log
            exit 1
          }

      - name: Set version output
        id: set_version
        run: echo "version=$(./gradlew -q printVersion)" >> $GITHUB_OUTPUT

      - name: Save new build to cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@v3
        with:
          path: ./build
          key: build-${{ hashFiles('./**/*') }}

      - name: Upload bootJar artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          retention-days: 90
          overwrite: true
          name: bootJar
          path: ./build/libs/app.jar

      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            ./build/libs/app.jar#streamit-service-${{ steps.set_version.outputs.version }}.jar \
            ./build/release-assets/types.d.ts \
            ./build/release-assets/openapi.yaml \
            --clobber

  docker-build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs:
      - build-service
    steps:
      - name: Set version env
        run: echo "VERSION=${{ needs.build-service.outputs.version }}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download bootJar artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: bootJar
          path: ./

      - name: Docker login
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          username: ${{ secrets.DOCKER_HUB_NAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Debug Check extracted version
        run: |
          echo "Extracted version: ${{ env.VERSION }}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            MODULE_NAME=ui
            PASS_APP_VERSION=${{ env.VERSION }}
          push: true
          tags: |
            bskjon/streamit-service:latest
            bskjon/streamit-service:${{ github.sha }}
            bskjon/streamit-service:${{ env.VERSION }}
